<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViVe Framework Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ViVe Framework Dashboard</h1>
            <div class="status" id="status">Disconnected</div>
        </header>

        <main>
            <div class="section">
                <h2>Timetable</h2>
                <button id="timetableBtn">Get Timetable</button>
                <div id="timetableData"></div>
            </div>

            <div class="section">
                <h2>Authenticated Devices</h2>
                <ul id="authedDevicesList" class="device-list"></ul>
            </div>

            <div class="section">
                <h2>Pending Requests</h2>
                <ul id="pendingDevicesList" class="device-list"></ul>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
