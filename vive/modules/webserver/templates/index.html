<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViVe Framework Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <h1>ViVe Framework Dashboard</h1>
            <div class="status" id="status">Disconnected</div>
        </header>

        <main>
            <div class="section">
                <h2>Options</h2>
                <div class="options-grid">
                    <button id="restartBtn">Restart All Services</button>
                    <button id="stopBtn">Stop All Services</button>
                    <button id="showIpBtn">Show Server IP</button>
                    <button id="open-webcam">Open Webcam Stream</button>
                </div>
                <div id="serverIp"></div>
            </div>
            <div class="section">
                <h2>Timetable</h2>
                <button id="timetableBtn">Get Timetable</button>
                <div id="timetableData"></div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
